version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    labels: [maintenance]
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # Types track the oldest supported Node.js (engines), not the newest release.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    # Keep major upgrades separate so breaking changes receive focused review.
    groups:
      production-minor-and-patch:
        dependency-type: production
        update-types: [minor, patch]
      development-minor-and-patch:
        dependency-type: development
        update-types: [minor, patch]

  # The root covers workflows and local composite actions under .github.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels: [maintenance]
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
