name: Native Node and browser tests
on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with: { node-version: "24", cache: npm, package-manager-cache: false }
      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - run: npm ci
      - run: npx --no-install playwright install chromium
      - run: npm run check
      - run: npm run prepare:models
      - run: npm run test:browser
      - run: npm run package:app
      - run: npm run test:packaged
      - run: node scripts/test-rag-model.mjs
      - name: Supply fish on disposable native runner
        timeout-minutes: 5
        run: brew install fish
      - run: npm run test:installation -- --require-fish
      - run: npm run package:payload
      - run: npm run test:payload
      - run: npm run test:setup
      - run: npm run test:update
      # Payload verification makes each actual update expensive on this runner.
      # Keep whole journeys and their existing deadlines; retain every batch.
      - name: Native retained and restart regressions
        run: npm run test:transmission -- --grep-invert 'native update:' --output test-results/transmission-native/regressions
      - name: Native application update journey 1
        run: npm run test:transmission -- --grep 'native update:' --fully-parallel --shard=1/2 --output test-results/transmission-native/update-1
      - name: Native application update journey 2
        run: npm run test:transmission -- --grep 'native update:' --fully-parallel --shard=2/2 --output test-results/transmission-native/update-2
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: code60-darwin-payload
          path: release/payloads/
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: native-installation-evidence
          path: |
            test-results/installation/
            test-results/setup/
            test-results/update/
            test-results/payload/
            test-results/transmission-native/
          retention-days: 7
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          {
            name: native-failure,
            path: test-results/,
            retention-days: 7,
            if-no-files-found: ignore,
          }
  uninstall:
    name: Native installed uninstall acceptance
    needs: test
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with: { node-version: "24", cache: npm, package-manager-cache: false }
      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - run: npm ci
      - uses: actions/download-artifact@v8.0.2
        with:
          name: code60-darwin-payload
          path: release/payloads/
      - run: npm run verify:artifact -- release/payloads/darwin-arm64.json
      - run: npm run build
      - run: npm run build:distribution
      - run: npx --no-install playwright install chromium
      - run: npm run test:uninstall
      - run: npm run test:uninstall:engines
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: native-uninstall-evidence
          path: |
            test-results/artifact-handoff/
            test-results/uninstall/
            test-results/uninstall-engines/
          retention-days: 7
          if-no-files-found: warn
