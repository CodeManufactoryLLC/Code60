name: Native tests

# Shared by native validation and release. Callers pass no secrets.
on:
  workflow_call:
    inputs:
      os:
        description: Hosted runner label, windows-2025 or macos-15
        required: true
        type: string
      ref:
        description: Exact commit to test
        required: true
        type: string
      suite:
        description: unit or desktop
        required: true
        type: string
      shard:
        description: One-based desktop shard index
        required: false
        default: 1
        type: number
      shards:
        description: Total desktop shard count
        required: false
        default: 1
        type: number
      unit_filter:
        description: Optional Vitest file filter; skips coverage gates
        required: false
        default: ""
        type: string
      desktop_grep:
        description: Optional Playwright --grep pattern
        required: false
        default: ""
        type: string
      release:
        description: Run with the release job environment
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  test:
    name: ${{ inputs.suite == 'desktop' && format('desktop {0}/{1}', inputs.shard, inputs.shards) || 'unit' }}
    runs-on: ${{ inputs.os }}
    timeout-minutes: 45
    env:
      CODE60_RELEASE: ${{ inputs.release && '1' || '' }}
      RELEASE_SHA: ${{ inputs.release && inputs.ref || '' }}
    steps:
      - name: Reject unknown suites
        if: inputs.suite != 'unit' && inputs.suite != 'desktop'
        run: exit 1
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          architecture: ${{ runner.os == 'Windows' && 'x64' || '' }}
          cache: npm
          package-manager-cache: false
      - name: Require native Windows x64
        if: runner.os == 'Windows'
        run: node -e "if(process.platform !== 'win32' || process.arch !== 'x64') process.exit(1)"
      - name: Use runner temp for Windows fixtures
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      - name: Verify runner architecture and configure fixture Git identity
        if: runner.os == 'macOS'
        run: |
          test "$(uname -m)" = arm64
          git config --global user.name 'Code60 CI'
          git config --global user.email 'ci@example.invalid'
      - run: npm ci
      - run: node scripts/install-electron.mjs
      - name: Unit tests with coverage gates
        if: inputs.suite == 'unit' && inputs.unit_filter == ''
        run: npm run check
      - name: Filtered unit tests without coverage gates
        if: inputs.suite == 'unit' && inputs.unit_filter != ''
        shell: bash
        env:
          UNIT_FILTER: ${{ inputs.unit_filter }}
        # Vitest is invoked directly so the filter never passes through cmd.exe quoting.
        run: |
          node scripts/build-windows-helper.mjs
          node node_modules/vitest/vitest.mjs run "$UNIT_FILTER"
      - name: Retain coverage reports
        uses: actions/upload-artifact@v7.0.2
        if: always() && inputs.suite == 'unit' && inputs.unit_filter == ''
        with:
          name: coverage-${{ inputs.os }}-node-24
          path: coverage/
          retention-days: 7
          if-no-files-found: warn
          overwrite: true
      - if: inputs.suite == 'desktop'
        run: npm run prepare:models
      - name: Desktop tests
        if: inputs.suite == 'desktop'
        shell: bash
        env:
          SHARD: ${{ inputs.shard }}
          SHARDS: ${{ inputs.shards }}
          DESKTOP_GREP: ${{ inputs.desktop_grep }}
        # Equivalent to npm run test:desktop; Playwright is invoked directly so the
        # grep pattern never passes through cmd.exe quoting. --fully-parallel lets
        # shards split tests inside desktop.e2e.ts instead of whole files.
        run: |
          args=(--fully-parallel "--shard=$SHARD/$SHARDS")
          if [ -n "$DESKTOP_GREP" ]; then args+=(--grep "$DESKTOP_GREP" --pass-with-no-tests); fi
          npm run build
          node node_modules/@playwright/test/cli.js test "${args[@]}"
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: native-${{ inputs.os }}-${{ inputs.suite }}-${{ inputs.shard }}-failure
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
          overwrite: true
