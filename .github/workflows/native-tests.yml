name: Native Node and browser tests
on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with: { node-version: "24", cache: npm, package-manager-cache: false }
      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - run: npm ci
      - run: npx --no-install playwright install chromium
      - run: npm run check
      - run: npm run prepare:models
      - run: npm run test:browser
      - run: npm run package:app
      - run: npm run test:packaged
      - run: node scripts/test-rag-model.mjs
      - run: npm run package:payload
      - run: npm run test:payload
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: code60-darwin-payload
          path: release/payloads/
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          {
            name: native-failure,
            path: test-results/,
            retention-days: 7,
            if-no-files-found: ignore,
          }
