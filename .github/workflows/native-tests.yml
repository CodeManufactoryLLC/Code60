name: Native Node and browser tests
on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      suites:
        type: string
        default: '["mac-full"]'
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with: { node-version: "24", cache: npm, package-manager-cache: false }
      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - run: ONNXRUNTIME_NODE_INSTALL=skip npm ci
      - if: contains(fromJSON(inputs.suites), 'mac-full') || contains(fromJSON(inputs.suites), 'mac-setup')
        run: npx --no-install playwright install chromium
      - if: contains(fromJSON(inputs.suites), 'mac-full')
        run: npm run check
      - run: npm run prepare:models
      - if: contains(fromJSON(inputs.suites), 'mac-full')
        run: npm run test:browser
      - if: contains(fromJSON(inputs.suites), 'mac-full') || contains(fromJSON(inputs.suites), 'mac-package')
        run: npm run package:app
      - if: contains(fromJSON(inputs.suites), 'mac-full') || contains(fromJSON(inputs.suites), 'mac-package')
        run: npm run test:packaged
      - if: contains(fromJSON(inputs.suites), 'mac-full') || contains(fromJSON(inputs.suites), 'mac-package')
        run: node scripts/test-rag-model.mjs
      - if: contains(fromJSON(inputs.suites), 'mac-full') || contains(fromJSON(inputs.suites), 'mac-shell')
        name: Supply fish on disposable native runner
        timeout-minutes: 5
        run: brew install fish
      - if: contains(fromJSON(inputs.suites), 'mac-full') || contains(fromJSON(inputs.suites), 'mac-shell')
        run: npm run test:installation -- --require-fish
      - if: contains(fromJSON(inputs.suites), 'mac-full') || contains(fromJSON(inputs.suites), 'mac-engines') || contains(fromJSON(inputs.suites), 'mac-payload') || contains(fromJSON(inputs.suites), 'mac-setup') || contains(fromJSON(inputs.suites), 'mac-update') || contains(fromJSON(inputs.suites), 'mac-uninstall')
        run: npm run package:payload
      - if: contains(fromJSON(inputs.suites), 'mac-full') || contains(fromJSON(inputs.suites), 'mac-payload')
        run: npm run test:payload
      - if: contains(fromJSON(inputs.suites), 'mac-full') || contains(fromJSON(inputs.suites), 'mac-setup')
        run: npm run test:setup
      - uses: actions/upload-artifact@v7.0.2
        if: contains(fromJSON(inputs.suites), 'mac-full') || contains(fromJSON(inputs.suites), 'mac-engines') || contains(fromJSON(inputs.suites), 'mac-payload') || contains(fromJSON(inputs.suites), 'mac-setup') || contains(fromJSON(inputs.suites), 'mac-update') || contains(fromJSON(inputs.suites), 'mac-uninstall')
        with:
          name: code60-darwin-payload
          path: release/payloads/
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: native-installation-evidence
          path: |
            test-results/installation/
            test-results/setup/
            test-results/update/
            test-results/payload/
            test-results/transmission-native/
          retention-days: 7
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          {
            name: native-failure,
            path: test-results/,
            retention-days: 7,
            if-no-files-found: ignore,
          }
  workflows:
    name: Native installed workflows (${{ matrix.name }})
    needs: test
    if: contains(fromJSON(inputs.suites), 'mac-full') || contains(fromJSON(inputs.suites), 'mac-update') || contains(fromJSON(inputs.suites), 'mac-engines')
    runs-on: macos-15
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - name: update
            suite: mac-update
            command: npm run test:update
          - name: regressions
            suite: mac-engines
            command: npm run test:transmission -- --grep-invert 'native update:' --output test-results/transmission-native/regressions
          - name: update-1
            suite: mac-engines
            command: npm run test:transmission -- --grep 'native update:' --fully-parallel --shard=1/2 --output test-results/transmission-native/update-1
          - name: update-2
            suite: mac-engines
            command: npm run test:transmission -- --grep 'native update:' --fully-parallel --shard=2/2 --output test-results/transmission-native/update-2
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        if: contains(fromJSON(inputs.suites), 'mac-full') || contains(fromJSON(inputs.suites), matrix.suite)
        with: { node-version: "24", cache: npm, package-manager-cache: false }
      - if: contains(fromJSON(inputs.suites), 'mac-full') || contains(fromJSON(inputs.suites), matrix.suite)
        name: Verify Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - if: contains(fromJSON(inputs.suites), 'mac-full') || contains(fromJSON(inputs.suites), matrix.suite)
        run: ONNXRUNTIME_NODE_INSTALL=skip npm ci
      - uses: actions/download-artifact@v8.0.2
        if: contains(fromJSON(inputs.suites), 'mac-full') || contains(fromJSON(inputs.suites), matrix.suite)
        with:
          name: code60-darwin-payload
          path: release/payloads/
      - if: contains(fromJSON(inputs.suites), 'mac-full') || contains(fromJSON(inputs.suites), matrix.suite)
        run: npm run verify:artifact -- release/payloads/darwin-arm64.json
      - if: contains(fromJSON(inputs.suites), 'mac-full') || contains(fromJSON(inputs.suites), matrix.suite)
        run: npm run prepare:models
      - if: contains(fromJSON(inputs.suites), 'mac-full') || contains(fromJSON(inputs.suites), matrix.suite)
        run: npm run build
      - if: contains(fromJSON(inputs.suites), 'mac-full') || contains(fromJSON(inputs.suites), matrix.suite)
        run: npm run prepare:engines
      - if: contains(fromJSON(inputs.suites), 'mac-full') || contains(fromJSON(inputs.suites), matrix.suite)
        run: npx --no-install playwright install chromium
      - if: contains(fromJSON(inputs.suites), 'mac-full') || contains(fromJSON(inputs.suites), matrix.suite)
        name: Run complete native journey
        run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: native-workflows-${{ matrix.name }}
          path: |
            test-results/artifact-handoff/
            test-results/update/
            test-results/transmission-native/
          retention-days: 7
          if-no-files-found: warn
  uninstall:
    name: Native installed uninstall acceptance
    needs: test
    if: contains(fromJSON(inputs.suites), 'mac-full') || contains(fromJSON(inputs.suites), 'mac-uninstall')
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with: { node-version: "24", cache: npm, package-manager-cache: false }
      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - run: ONNXRUNTIME_NODE_INSTALL=skip npm ci
      - uses: actions/download-artifact@v8.0.2
        with:
          name: code60-darwin-payload
          path: release/payloads/
      - run: npm run verify:artifact -- release/payloads/darwin-arm64.json
      - run: npm run build
      - run: npm run build:distribution
      - run: npx --no-install playwright install chromium
      - run: npm run test:uninstall
      - run: npm run test:uninstall:engines
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: native-uninstall-evidence
          path: |
            test-results/artifact-handoff/
            test-results/uninstall/
            test-results/uninstall-engines/
          retention-days: 7
          if-no-files-found: warn
