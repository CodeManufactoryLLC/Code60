name: Build release npm package
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag merged into main
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  preflight:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.validate.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@v7
        with: { node-version: "24", package-manager-cache: false }
      - id: validate
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node scripts/release/preflight.mjs
  mac:
    needs: preflight
    uses: ./.github/workflows/native-tests.yml
    with:
      ref: ${{ needs.preflight.outputs.sha }}
  package:
    needs: [preflight, mac]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with: { node-version: "24", cache: npm, package-manager-cache: false }
      - run: npm ci
      - run: npm run check
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run prepare:models
      - run: npm run test:browser
      - run: npm run package:app
      - run: npm run test:packaged
      - name: Verify release package manifest
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SHA: ${{ needs.preflight.outputs.sha }}
        run: node scripts/release/manifest.mjs
      - uses: actions/upload-artifact@v7.0.2
        with:
          {
            name: code60-npm-package,
            path: release/build/,
            retention-days: 14,
            if-no-files-found: error,
          }
