name: Build release npm package
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag merged into main
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  preflight:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.validate.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@v7
        with: { node-version: "24", package-manager-cache: false }
      - id: validate
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node scripts/release/preflight.mjs
  mac:
    needs: preflight
    uses: ./.github/workflows/native-tests.yml
    with:
      ref: ${{ needs.preflight.outputs.sha }}
  package:
    needs: [preflight, mac]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with: { node-version: "24", cache: npm, package-manager-cache: false }
      - run: npm ci
      - uses: ./.github/actions/private-node
      - run: npm run check
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run prepare:models
      - run: npm run test:browser
      - run: npm run package:app
      - run: npm run test:packaged
      - name: Verify release package manifest
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SHA: ${{ needs.preflight.outputs.sha }}
        run: node scripts/release/manifest.mjs
      - uses: actions/upload-artifact@v7.0.2
        with:
          {
            name: code60-npm-package,
            path: release/build/,
            retention-days: 14,
            if-no-files-found: error,
          }
  payload:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The runner's Compose 2.x Bake path omits the CLI's temporary Dockerfile grant.
    # Scope the classic builder selection to this disposable job only.
    env: { COMPOSE_BAKE: "false" }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with: { node-version: "24", cache: npm, package-manager-cache: false }
      - run: npm ci
      - name: Prepare isolated runner Docker engine
        timeout-minutes: 2
        run: |
          sudo systemctl start docker
          docker info
      - run: npm run devcontainer -- up
      - run: npm run devcontainer -- exec npm ci
      - run: npm run devcontainer -- exec npm run prepare:models
      - run: npm run devcontainer -- exec npm run package:payload
      - run: npm run devcontainer -- exec npx --no-install playwright install chromium
      - run: npm run devcontainer -- exec npm run test:payload -- --workflows
      - run: npm run devcontainer -- exec npm run test:setup
      - run: npm run devcontainer -- exec npm run test:installation -- --require-fish
      - run: npm run test:packaged:clean -- --payload release/payloads/linux-x64.json
      - run: npm run test:packaged:clean -- --managed release/payloads/linux-x64.json
      - run: npm run test:packaged:clean -- --setup release/payloads/linux-x64.json
      - run: npm run devcontainer -- down
        if: always()
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: code60-linux-payload
          path: release/payloads/
          retention-days: 14
          if-no-files-found: error
  bootstrap:
    needs: [preflight, mac, payload]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with: { node-version: "24", package-manager-cache: false }
      - run: npm ci
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: code60-*-payload
          merge-multiple: true
          path: release/payloads/
      - name: Require clean matching release payloads
        env:
          RELEASE_SHA: ${{ needs.preflight.outputs.sha }}
        run: node scripts/release/verify-payloads.mjs
      - run: npm run package:bootstrap -- release/payloads
      - run: npm run test:bootstrap
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: code60-bootstrap
          path: release/bootstrap/
          retention-days: 14
          if-no-files-found: error
