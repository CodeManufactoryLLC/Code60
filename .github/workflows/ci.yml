name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Linux / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        node: ["22.12", "24"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          package-manager-cache: false
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: CLI smoke checks
        run: |
          node dist/cli/main.js --help
          node dist/cli/main.js --version

  desktop:
    name: Linux desktop and installers
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          package-manager-cache: false
      - uses: ./.github/actions/setup-linux-desktop
      - run: npm ci
      - run: xvfb-run -a npm run test:desktop
      - run: npm run package:linux
      - run: xvfb-run -a npm run test:installers
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: linux-desktop-failure
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  windows:
    name: Windows x64 / Node 24
    needs: check
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          architecture: x64
          cache: npm
          package-manager-cache: false
      - name: Require native Windows x64
        run: node -e "if(process.platform !== 'win32' || process.arch !== 'x64') process.exit(1)"
      - run: npm ci
      - run: npm run check
      - run: npm run test:desktop
      - name: CLI smoke checks
        run: |
          node dist/cli/main.js --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node dist/cli/main.js --version
      - run: npm run package:win
      - run: npm run test:installers
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: windows-desktop-failure
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  passed:
    name: CI passed
    needs: [check, desktop, windows]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require every validation job to succeed
        env:
          CHECK: ${{ needs.check.result }}
          DESKTOP: ${{ needs.desktop.result }}
          WINDOWS: ${{ needs.windows.result }}
        run: test "$CHECK" = success && test "$DESKTOP" = success && test "$WINDOWS" = success
