name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Linux / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        node: ["22.12", "24"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          package-manager-cache: false
      - run: npm ci
      - run: npm run check
      - name: Retain coverage reports
        uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: coverage-linux-node-${{ matrix.node }}
          path: coverage/
          retention-days: 7
          if-no-files-found: warn
      - run: npm run build
      - run: npm run prepare:models
      - run: node scripts/test-rag-model.mjs
      - name: CLI smoke checks
        run: |
          node dist/cli/main.js --help
          node dist/cli/main.js --version

  desktop:
    name: Linux desktop and installers
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          package-manager-cache: false
      - uses: ./.github/actions/setup-linux-desktop
      - run: npm ci
      - run: node scripts/install-electron.mjs
      - run: npm run prepare:models
      - run: xvfb-run -a npm run test:desktop
      - run: npm run package:linux
      - run: xvfb-run -a npm run test:installers
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: linux-desktop-failure
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  passed:
    name: CI passed
    needs: [check, desktop]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require every validation job to succeed
        env:
          CHECK: ${{ needs.check.result }}
          DESKTOP: ${{ needs.desktop.result }}
        run: test "$CHECK" = success && test "$DESKTOP" = success
