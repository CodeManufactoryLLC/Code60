name: CI
on:
  push:
    branches: [main]
  pull_request: null
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: Linux / Node 24
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@v7
        with: { node-version: "24", cache: npm, package-manager-cache: false }
      - run: npm ci
      - run: npm run check
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          {
            name: coverage-linux-node-24,
            path: coverage/,
            retention-days: 7,
            if-no-files-found: warn,
          }
  browser:
    name: Linux browser journeys
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@v7
        with: { node-version: "24", cache: npm, package-manager-cache: false }
      - run: npm ci
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run prepare:models
      - run: npm run test:browser
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          {
            name: browser-failure,
            path: test-results/,
            retention-days: 7,
            if-no-files-found: ignore,
          }
  package:
    name: Linux installed npm package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@v7
        with: { node-version: "24", cache: npm, package-manager-cache: false }
      - run: npm ci
      - run: npm run prepare:models
      - run: npm run package:app
      - run: npm run test:packaged
      - run: node scripts/test-rag-model.mjs
  passed:
    name: CI passed
    needs: [check, browser, package]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require every validation job to succeed
        env:
          CHECK: ${{ needs.check.result }}
          BROWSER: ${{ needs.browser.result }}
          PACKAGE: ${{ needs.package.result }}
        run: test "$CHECK" = success && test "$BROWSER" = success && test "$PACKAGE" = success
