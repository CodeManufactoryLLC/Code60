name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ fromJSON(matrix.runs-on) }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-self-hosted]
        node: ["22.12", "24"]
        include:
          - os: ubuntu-latest
            runs-on: '["ubuntu-latest"]'
            npm-cache: npm
          # The self-hosted Mac at /Users/matthew/actions-runner (labels: self-hosted, macOS, ARM64).
          # It keeps its own ~/.npm between runs, so it skips the GitHub cache.
          - os: macos-self-hosted
            runs-on: '["self-hosted", "macOS", "ARM64"]'
            npm-cache: ""
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: ${{ matrix.npm-cache }}
          package-manager-cache: false
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Smoke test the CLI
        run: node dist/cli/main.js --help
