name: CI
on:
  push:
    branches: [main]
  pull_request: null
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  impact:
    name: Select required validation
    runs-on: ubuntu-24.04
    outputs:
      jobs: ${{ steps.route.outputs.jobs }}
      plan: ${{ steps.route.outputs.plan }}
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false, fetch-depth: 0 }
      - id: route
        run: node scripts/ci-impact.mjs
  check:
    needs: impact
    if: contains(fromJSON(needs.impact.outputs.jobs), 'check')
    name: Linux / Node 24
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@v7
        with: { node-version: "24", cache: npm, package-manager-cache: false }
      - run: ONNXRUNTIME_NODE_INSTALL=skip npm ci
      - uses: ./.github/actions/private-node
      - if: contains(fromJSON(needs.impact.outputs.plan), 'instructions')
        run: npm run check:instructions
      - if: contains(fromJSON(needs.impact.outputs.plan), 'check')
        run: npm run check
      - uses: actions/upload-artifact@v7.0.2
        if: always() && contains(fromJSON(needs.impact.outputs.plan), 'check')
        with:
          {
            name: coverage-linux-node-24,
            path: coverage/,
            retention-days: 7,
            if-no-files-found: warn,
          }
  browser:
    needs: impact
    if: contains(fromJSON(needs.impact.outputs.jobs), 'browser')
    name: Linux browser journeys
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@v7
        with: { node-version: "24", cache: npm, package-manager-cache: false }
      - run: ONNXRUNTIME_NODE_INSTALL=skip npm ci
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run prepare:models
      - run: npm run test:browser
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          {
            name: browser-failure,
            path: test-results/,
            retention-days: 7,
            if-no-files-found: ignore,
          }
  package:
    needs: impact
    if: contains(fromJSON(needs.impact.outputs.jobs), 'package')
    name: Linux installed npm package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@v7
        with: { node-version: "24", cache: npm, package-manager-cache: false }
      - run: ONNXRUNTIME_NODE_INSTALL=skip npm ci
      - uses: ./.github/actions/private-node
      - run: npm run prepare:models
      - run: npm run package:app
      - run: npm run test:packaged
      - run: node scripts/test-rag-model.mjs
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: code60-linux-baseline-package
          path: release/build/code60-*.tgz
          retention-days: 1
          if-no-files-found: error
  clean-install:
    needs: [impact, package]
    if: contains(fromJSON(needs.impact.outputs.jobs), 'clean-install')
    name: Linux clean installation acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@v7
        with: { node-version: "24", package-manager-cache: false }
      - name: Prepare isolated runner Docker engine
        timeout-minutes: 2
        run: |
          sudo systemctl start docker
          docker info
      - uses: actions/download-artifact@v8.0.2
        with:
          name: code60-linux-baseline-package
          path: release/build
      - run: npm run test:packaged:clean
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: clean-installation-evidence
          path: test-results/clean-install/
          retention-days: 7
          if-no-files-found: warn
  payload:
    needs: impact
    if: contains(fromJSON(needs.impact.outputs.jobs), 'payload')
    name: Linux platform payload
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The runner's Compose 2.x Bake path omits the CLI's temporary Dockerfile grant.
    # Scope the classic builder selection to this disposable job only.
    env: { COMPOSE_BAKE: "false" }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with: { node-version: "24", cache: npm, package-manager-cache: false }
      - run: ONNXRUNTIME_NODE_INSTALL=skip npm ci
      - name: Prepare isolated runner Docker engine
        timeout-minutes: 2
        run: |
          sudo systemctl start docker
          docker info
      - run: npm run devcontainer -- up
      - run: npm run devcontainer -- exec npm ci
      - run: npm run devcontainer -- exec npm run prepare:models
      - run: npm run devcontainer -- exec npm run package:payload
      - run: npm run devcontainer -- down
        if: always()
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: code60-linux-payload
          path: release/payloads/
          retention-days: 7
          if-no-files-found: error
  payload-acceptance:
    needs: [impact, payload]
    if: contains(fromJSON(needs.impact.outputs.jobs), 'payload-acceptance')
    name: Linux platform payload acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The runner's Compose 2.x Bake path omits the CLI's temporary Dockerfile grant.
    # Scope the classic builder selection to this disposable job only.
    env: { COMPOSE_BAKE: "false" }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with: { node-version: "24", cache: npm, package-manager-cache: false }
      - run: ONNXRUNTIME_NODE_INSTALL=skip npm ci
      - uses: actions/download-artifact@v8.0.2
        with:
          name: code60-linux-payload
          path: release/payloads/
      - run: npm run verify:artifact -- release/payloads/linux-x64.json
      - name: Prepare isolated runner Docker engine
        timeout-minutes: 2
        run: |
          sudo systemctl start docker
          docker info
      - run: npm run devcontainer -- up
      - run: npm run devcontainer -- exec npm ci
      - run: npm run devcontainer -- exec npm run build
      - if: contains(fromJSON(needs.impact.outputs.plan), 'update') || contains(fromJSON(needs.impact.outputs.plan), 'setup')
        run: npm run devcontainer -- exec npx --no-install playwright install chromium
      - run: npm run devcontainer -- exec env CODE60_REQUIRE_NATIVE_PROCESS_INSPECTION=1 npx --no-install vitest run src/platform/process-identity.test.ts
      - if: contains(fromJSON(needs.impact.outputs.plan), 'payload-smoke')
        run: npm run devcontainer -- exec npm run test:payload
      - if: contains(fromJSON(needs.impact.outputs.plan), 'setup')
        run: npm run devcontainer -- exec npm run test:setup
      - if: contains(fromJSON(needs.impact.outputs.plan), 'update')
        run: npm run devcontainer -- exec npm run test:update
      - if: contains(fromJSON(needs.impact.outputs.plan), 'shell')
        run: npm run devcontainer -- exec npm run test:installation -- --require-fish
      - run: npm run devcontainer -- down
        if: always()
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: payload-acceptance-evidence
          path: |
            test-results/artifact-handoff/
            test-results/payload/
            test-results/installation/
            test-results/setup/
            test-results/update/
          retention-days: 7
          if-no-files-found: warn
  payload-clean-install:
    needs: [impact, payload]
    if: contains(fromJSON(needs.impact.outputs.jobs), 'payload-clean-install')
    name: Linux offline payload acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with: { node-version: "24", cache: npm, package-manager-cache: false }
      - run: ONNXRUNTIME_NODE_INSTALL=skip npm ci
      - run: npm run build:distribution
      - name: Prepare isolated runner Docker engine
        timeout-minutes: 2
        run: |
          sudo systemctl start docker
          docker info
      - uses: actions/download-artifact@v8.0.2
        with:
          name: code60-linux-payload
          path: release/payloads/
      - run: npm run verify:artifact -- release/payloads/linux-x64.json
      - if: contains(fromJSON(needs.impact.outputs.plan), 'clean-payload')
        run: npm run test:packaged:clean -- --payload release/payloads/linux-x64.json
      - if: contains(fromJSON(needs.impact.outputs.plan), 'managed')
        run: npm run test:packaged:clean -- --managed release/payloads/linux-x64.json
      - if: contains(fromJSON(needs.impact.outputs.plan), 'clean-setup')
        run: npm run test:packaged:clean -- --setup release/payloads/linux-x64.json
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: payload-clean-install-evidence
          path: |
            test-results/artifact-handoff/
            test-results/clean-install/
          retention-days: 7
          if-no-files-found: warn
  update:
    needs: [impact, payload]
    if: contains(fromJSON(needs.impact.outputs.jobs), 'update')
    name: Linux offline update acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with: { node-version: "24", cache: npm, package-manager-cache: false }
      - run: ONNXRUNTIME_NODE_INSTALL=skip npm ci
      - run: npm run build:distribution
      - name: Prepare isolated runner Docker engine
        timeout-minutes: 2
        run: |
          sudo systemctl start docker
          docker info
      - uses: actions/download-artifact@v8.0.2
        with:
          name: code60-linux-payload
          path: release/payloads/
      - run: npm run verify:artifact -- release/payloads/linux-x64.json
      - run: npm run test:packaged:clean -- --update release/payloads/linux-x64.json
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: offline-update-evidence
          path: |
            test-results/artifact-handoff/
            test-results/clean-install/
          retention-days: 7
          if-no-files-found: warn
  uninstall:
    needs: [impact, payload]
    if: contains(fromJSON(needs.impact.outputs.jobs), 'uninstall')
    name: Linux concurrent uninstall acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with: { node-version: "24", cache: npm, package-manager-cache: false }
      - run: ONNXRUNTIME_NODE_INSTALL=skip npm ci
      - run: npm run build:distribution
      - name: Prepare isolated runner Docker engine
        timeout-minutes: 2
        run: |
          sudo systemctl start docker
          docker info
      - uses: actions/download-artifact@v8.0.2
        with:
          name: code60-linux-payload
          path: release/payloads/
      - run: npm run verify:artifact -- release/payloads/linux-x64.json
      - run: npm run test:packaged:concurrent -- --uninstall release/payloads/linux-x64.json
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: concurrent-uninstall-evidence
          path: |
            test-results/artifact-handoff/
            test-results/clean-install/
            test-results/clean-install-concurrent/
          retention-days: 7
          if-no-files-found: warn
  mac:
    needs: impact
    if: contains(fromJSON(needs.impact.outputs.jobs), 'mac')
    uses: ./.github/workflows/native-tests.yml
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
      suites: ${{ needs.impact.outputs.plan }}
  passed:
    name: CI passed
    needs:
      [
        impact,
        check,
        browser,
        package,
        clean-install,
        payload,
        payload-acceptance,
        payload-clean-install,
        update,
        uninstall,
        mac,
      ]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false, fetch-depth: 0 }
      - name: Verify selected jobs and summarize impact
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci-impact.mjs gate
