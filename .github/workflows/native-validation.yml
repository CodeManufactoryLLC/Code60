name: Native release validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: ${{ matrix.os }} validation
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          package-manager-cache: false
      - name: Use runner temp for Windows fixtures
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      - run: npm ci
      - run: node scripts/install-electron.mjs
      - run: npm run check
      - name: Retain coverage reports
        uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: coverage-${{ matrix.os }}-node-24
          path: coverage/
          retention-days: 7
          if-no-files-found: warn
      - run: npm run test:desktop
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: native-${{ matrix.os }}-failure
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
