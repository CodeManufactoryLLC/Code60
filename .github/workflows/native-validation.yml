name: Native release validation
run-name: Native validation (${{ (inputs.suite == 'full' && inputs.unit_filter == '' && inputs.desktop_grep == '') && 'acceptance' || 'diagnosis' }}) macos ${{ inputs.suite }} on ${{ github.ref_name }}
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Test suites to run
        required: false
        default: full
        type: choice
        options:
          - full
          - unit
          - desktop
      unit_filter:
        description: Optional Vitest file filter (diagnosis only; skips coverage gates)
        required: false
        default: ""
        type: string
      desktop_grep:
        description: Optional Playwright --grep pattern (diagnosis only; one shard)
        required: false
        default: ""
        type: string
permissions:
  contents: read
concurrency:
  group: native-validation-${{ github.ref }}-${{ (inputs.suite == 'full' && inputs.unit_filter == '' && inputs.desktop_grep == '') && 'acceptance' || github.run_id }}
  cancel-in-progress: ${{ inputs.suite == 'full' && inputs.unit_filter == '' && inputs.desktop_grep == '' }}
jobs:
  unit:
    name: macOS unit
    if: inputs.suite != 'desktop'
    uses: ./.github/workflows/native-tests.yml
    with:
      ref: ${{ github.sha }}
      suite: unit
      unit_filter: ${{ inputs.unit_filter }}
  desktop:
    name: macOS desktop ${{ matrix.shard }}
    if: inputs.suite != 'unit'
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.desktop_grep == '' && '[1,2,3]' || '[1]') }}
    uses: ./.github/workflows/native-tests.yml
    with:
      ref: ${{ github.sha }}
      suite: desktop
      shard: ${{ matrix.shard }}
      shards: ${{ inputs.desktop_grep == '' && 3 || 1 }}
      desktop_grep: ${{ inputs.desktop_grep }}
  passed:
    name: Native validation passed
    needs:
      - unit
      - desktop
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Summarize and require every selected job to succeed
        env:
          ACCEPTANCE: ${{ inputs.suite == 'full' && inputs.unit_filter == '' && inputs.desktop_grep == '' }}
          UNIT: ${{ needs.unit.result }}
          DESKTOP: ${{ needs.desktop.result }}
          PLATFORM: macos
          SUITE: ${{ inputs.suite }}
          UNIT_FILTER: ${{ inputs.unit_filter }}
          DESKTOP_GREP: ${{ inputs.desktop_grep }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$ACCEPTANCE" = true ]; then
            mode="Acceptance: release evidence for $SHA"
            test "$UNIT" = success && test "$DESKTOP" = success && ok=1 || ok=0
          else
            mode="Diagnosis: not release evidence"
            ok=1
            for result in "$UNIT" "$DESKTOP"; do
              case "$result" in success|skipped) ;; *) ok=0 ;; esac
            done
            test "$UNIT" = skipped && test "$DESKTOP" = skipped && ok=0
          fi
          {
            echo "## Native validation"
            echo
            echo "$mode"
            echo
            echo "| Setting | Value |"
            echo "| --- | --- |"
            echo "| Platform | \`$PLATFORM\` |"
            echo "| Suite | \`$SUITE\` |"
            echo "| Unit filter | \`${UNIT_FILTER:-none}\` |"
            echo "| Desktop grep | \`${DESKTOP_GREP:-none}\` |"
            echo "| Unit jobs | $UNIT |"
            echo "| Desktop jobs | $DESKTOP |"
          } >> "$GITHUB_STEP_SUMMARY"
          test "$ok" = 1
